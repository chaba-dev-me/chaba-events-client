[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaba-events-client"
version = "0.2.0"
description = "Receive Chaba (AgroIoT) device events over WebSocket — subclass one class to act on them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chaba contributors" }]
requires-python = ">=3.9"
dependencies = ["websockets>=12"]
keywords = ["chaba", "agroiot", "iot", "websocket", "events", "farm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]

[project.scripts]
chaba-events-client = "chaba_events_client.__main__:main"

[project.urls]
Homepage = "https://chaba.me"
Documentation = "https://docs.chaba.me"
Repository = "https://github.com/chaba-dev-me/chaba-events-client"

[tool.setuptools]
packages = ["chaba_events_client"]
